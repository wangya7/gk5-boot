server:
  port: 8102

spring:
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  profiles:
    active: druid

dubbo:
  application:
    name: gk5-boot-sample-dubbo-consumer-kryo
  protocol:
    name: dubbo
    port: -1
    # serialization: kryo
  registry:
    address: zookeeper://${zookeeper.address:192.168.0.101}:2181

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.log4j2.Log4j2Impl

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql